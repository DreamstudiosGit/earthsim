<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Wald</title>
  <defs>
    <clipPath id="forest-clip"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="forest-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd2e2"/>
      <stop offset="1" stop-color="#dcefd6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#forest-clip)">
    <rect x="1" y="1" width="30" height="30" fill="url(#forest-sky)"/>
    <!-- hintere Kronen und Tanne -->
    <circle cx="6" cy="15" r="5" fill="#2f6b36"/>
    <circle cx="15" cy="12.5" r="5.5" fill="#2f6b36"/>
    <path d="M22.5 5 L28 17 H17 Z" fill="#1d4a2a" stroke="#1d4a2a" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="28.5" cy="15.5" r="4.5" fill="#2f6b36"/>
    <!-- Boden -->
    <rect x="1" y="24" width="30" height="7" fill="#3d6e2e"/>
    <!-- Stämme -->
    <path d="M9.5 21 V26 M22 22 V26.5" stroke="#6b4a2a" stroke-width="2" stroke-linecap="round"/>
    <!-- vordere Laubkronen -->
    <circle cx="9.5" cy="18.5" r="5.2" fill="#5aa24a"/>
    <circle cx="22" cy="19.5" r="5.6" fill="#4b9440"/>
    <g fill="none" stroke="#b6e388" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M6.6 16.2 a3.6 3.6 0 0 1 3.4 -2.4"/>
      <path d="M18.8 17 a3.9 3.9 0 0 1 3.6 -2.6"/>
    </g>
    <path d="M1 27 q4 -1.2 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#8ad16f" stroke-width="1" stroke-opacity="0.6"/>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="#0c1a14" stroke-opacity="0.3" stroke-width="0.6"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
</svg>
