<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Flaches Küstenmeer</title>
  <defs>
    <clipPath id="coastalsea-clip"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="coastalsea-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd3cf"/>
      <stop offset="1" stop-color="#2896ab"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#coastalsea-clip)">
    <rect x="1" y="1" width="30" height="6" fill="#d4f1f6"/>
    <circle cx="6" cy="3.6" r="2.4" fill="#fff3c4"/>
    <rect x="1" y="6.5" width="30" height="25" fill="url(#coastalsea-water)"/>
    <!-- Sonnenstrahlen unter Wasser -->
    <g fill="#ffffff" fill-opacity="0.24">
