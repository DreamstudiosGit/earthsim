    <!-- hintere Kronen -->
    <g fill="#1f5a32">
      <circle cx="4" cy="10" r="6"/>
      <circle cx="12" cy="7.5" r="6.5"/>
      <circle cx="21" cy="8.5" r="6"/>
      <circle cx="29" cy="9.5" r="6"/>
    </g>
    <!-- Dunst -->
    <rect x="1" y="12.5" width="30" height="3.5" fill="#e6f5ec" fill-opacity="0.35"/>
    <!-- mittlere Kronen -->
    <g fill="#2f8b40">
      <circle cx="6" cy="18" r="6"/>
      <circle cx="16" cy="16.5" r="6.5"/>
      <circle cx="26.5" cy="18" r="6.5"/>
    </g>
    <g fill="none" stroke="#8ad16f" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M2.6 15.6 a4.4 4.4 0 0 1 3.6 -2.2"/>
      <path d="M12 13.6 a4.8 4.8 0 0 1 4 -2.4"/>
      <path d="M22.4 15.6 a4.8 4.8 0 0 1 4 -2.4"/>
    </g>
    <rect x="1" y="24" width="30" height="7" fill="#0f3a22"/>
    <!-- Wedel -->
    <path d="M1.5 31 C3 25 8 22 14 22.5 C10 24.5 6 27 4.5 31 Z" fill="#5cc24f"/>
    <path d="M30.5 31 C29 25 24 22 18 22.5 C22 24.5 26 27 27.5 31 Z" fill="#4fb045"/>
    <path d="M15.6 31 C13.8 27 14.4 23 17 20 C18.2 23.5 18 27 16.6 31 Z" fill="#6fd05a"/>
