    <g fill="#7fe0f0">
      <path d="M10.5 10.6 C11 11.6 12 12.6 12 13.5 A1.5 1.5 0 0 1 9 13.5 C9 12.6 10 11.6 10.5 10.6 Z"/>
      <path d="M23.5 19.6 C24 20.6 25 21.6 25 22.5 A1.5 1.5 0 0 1 22 22.5 C22 21.6 23 20.6 23.5 19.6 Z"/>
