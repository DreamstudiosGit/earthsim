<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Regenwald</title>
  <defs>
    <clipPath id="jungle-clip"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="jungle-air" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3e6d3"/>
      <stop offset="1" stop-color="#0f3a22"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#jungle-clip)">
