<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Atmosphäre/Sauerstoff</title>
  <defs>
    <clipPath id="atmosphere-clip"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="atmosphere-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a68ad"/>
      <stop offset="1" stop-color="#a6dcf3"/>
    </linearGradient>
    <linearGradient id="atmosphere-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a9ac0"/>
      <stop offset="1" stop-color="#2a7aa6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#atmosphere-clip)">
    <rect x="1" y="1" width="30" height="30" fill="url(#atmosphere-sky)"/>
    <!-- Sonnenstrahl -->
    <path d="M6 6 L11 4.5 L31 21 V27 Z" fill="#fff6d6" fill-opacity="0.25"/>
    <circle cx="6" cy="6" r="4.6" fill="#fff3c4" fill-opacity="0.4"/>
    <circle cx="6" cy="6" r="3" fill="#fff6d6"/>
    <!-- Planetenrand mit Lufthülle -->
    <circle cx="16" cy="52" r="29.4" fill="none" stroke="#bff4ff" stroke-opacity="0.35" stroke-width="1.4"/>
    <circle cx="16" cy="52" r="27.6" fill="none" stroke="#7fe0f0" stroke-opacity="0.85" stroke-width="1.6"/>
    <circle cx="16" cy="52" r="26" fill="url(#atmosphere-ground)"/>
    <path d="M6 28 C9 26.6 13 26.4 15 27.6 C13.5 29.5 9 30.5 6 30 Z" fill="#6fbf55"/>
    <path d="M21 27 C23.5 26.2 26 26.8 27 28 C25 29 22.5 29 21 27 Z" fill="#6fbf55"/>
    <!-- Sauerstoffbläschen -->
    <g fill="#7fe0f0" fill-opacity="0.6" stroke="#ffffff" stroke-width="0.9">
      <circle cx="21" cy="16" r="2.4"/>
      <circle cx="26" cy="10" r="1.8"/>
      <circle cx="15.5" cy="11" r="1.5"/>
      <circle cx="25" cy="20.5" r="1.3"/>
    </g>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="#0c1a14" stroke-opacity="0.3" stroke-width="0.6"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
</svg>
