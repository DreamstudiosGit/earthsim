<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Trockenes Land</title>
  <defs>
    <clipPath id="dryland-clip"><rect x="1" y="1" width="30" height="30" rx="8"/></clipPath>
    <linearGradient id="dryland-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c983"/>
      <stop offset="1" stop-color="#f9ecca"/>
    </linearGradient>
    <linearGradient id="dryland-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49b60"/>
      <stop offset="1" stop-color="#ad6b3a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#dryland-clip)">
    <rect x="1" y="1" width="30" height="14" fill="url(#dryland-sky)"/>
    <!-- Sonne -->
    <circle cx="9" cy="7.5" r="5.4" fill="#fff5cf" fill-opacity="0.4"/>
    <circle cx="9" cy="7.5" r="3.4" fill="#fff6d6"/>
    <!-- Hitzeflimmern -->
    <path d="M17 11 q1.5 -0.8 3 0 t3 0 M22 8 q1.5 -0.8 3 0 t3 0" fill="none" stroke="#e8a85c" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>
    <!-- rissige Erde -->
    <rect x="1" y="14.5" width="30" height="17" fill="url(#dryland-ground)"/>
    <g fill="none" stroke="#6b3f20" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 25 L6 23.5 L9 27 L7 31.5 M6 23.5 L8 19.5 L4 18 M9 27 L16 26 L18 31.5 M16 26 L17 21.5 L13 18.5 L8 19.5"/>
      <path d="M17 21.5 L24 22.5 L27 27.5 L31 26 M24 22.5 L26 18 L31 18.6 M26 18 L21 16.3 L17 16.8 L13 18.5 M27 27.5 L25 31.5"/>
      <path d="M3 16 L6.5 15.6 M9.5 15.5 L13.5 15.9 M21.5 15.3 L25 15.6" stroke-width="0.8"/>
    </g>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="#0c1a14" stroke-opacity="0.3" stroke-width="0.6"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
