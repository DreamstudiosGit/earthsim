  <path d="M11 43q2.6-1.8 5.2 0t5.2 0t5.2 0t5.2 0M13.5 38.5q2-1.6 4 0t4 0t4 0t4 0" fill="none" stroke="#0f3b3f" stroke-width="2"/>
