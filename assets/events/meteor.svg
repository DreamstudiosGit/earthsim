<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Meteoriteneinschlag</title>
  <defs>
    <linearGradient id="meteor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e1527"/>
      <stop offset="1" stop-color="#a63a2e"/>
    </linearGradient>
    <linearGradient id="meteor-trail" gradientUnits="userSpaceOnUse" x1="18" y1="29" x2="41" y2="7">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff7a6b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="meteor-clip"><rect x="2" y="2" width="44" height="44" rx="12"/></clipPath>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#meteor-bg)"/>
  <!-- Boden -->
  <path d="M2 41 Q24 35.5 46 41 V46 H2 Z" fill="#2a0e14" fill-opacity="0.6" clip-path="url(#meteor-clip)"/>
  <!-- Feuerschweif -->
  <path d="M13.8 24.8 L40 5.5 L42.5 8 L22.2 33.2 Z" fill="url(#meteor-trail)"/>
  <g fill="none" stroke="#ffe7a3" stroke-linecap="round">
    <path d="M22 22.5 L36 10.5" stroke-width="1.8" stroke-opacity="0.85"/>
    <path d="M25.5 28 L38 17" stroke-width="1.4" stroke-opacity="0.6"/>
  </g>
  <!-- Gesteinsbrocken -->
  <circle cx="18" cy="29" r="7.6" fill="none" stroke="#ffb347" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="18" cy="29" r="6.2" fill="#f6f1df"/>
  <g fill="#b8a68a">
    <circle cx="15.8" cy="30.8" r="1.7"/>
    <circle cx="20.2" cy="26.4" r="1.2"/>
    <circle cx="19.8" cy="32.2" r="0.9"/>
  </g>
  <path d="M13.6 27 A4.6 4.6 0 0 1 16 24.3" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="2.6" y="2.6" width="42.8" height="42.8" rx="11.4" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
</svg>
