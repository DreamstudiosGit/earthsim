      <stop offset="0" stop-color="#4f1b10"/>
      <stop offset="1" stop-color="#bd4a28"/>
    </linearGradient>
    <clipPath id="volcano-clip"><rect x="2" y="2" width="44" height="44" rx="12"/></clipPath>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#volcano-bg)"/>
  <!-- Aschewolke -->
  <g fill="#e9e0cf">
