<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Leben entsteht</title>
  <defs>
    <linearGradient id="life-formed-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3b3f"/>
      <stop offset="1" stop-color="#1f6f6b"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#life-formed-bg)"/>
  <!-- Wasseroberfläche des Urozeans -->
  <path d="M7 11.5 q3 -2 6 0 t6 0 t6 0 t6 0 t6 0 t4 0" fill="none" stroke="#7fd3f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M10 16 q2.5 -1.5 5 0 t5 0 M28 16 q2.5 -1.5 5 0 t5 0" fill="none" stroke="#7fd3f0" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- sich teilende Zelle -->
  <g stroke="#f6f1df" stroke-width="2.4">
    <circle cx="20" cy="28" r="6.5"/>
    <circle cx="29" cy="25.6" r="5.5"/>
  </g>
  <g fill="#2f9a8f">
    <circle cx="20" cy="28" r="6.5"/>
    <circle cx="29" cy="25.6" r="5.5"/>
  </g>
  <circle cx="19.4" cy="28.4" r="2.4" fill="#8ff0e4"/>
  <circle cx="29.6" cy="25" r="2" fill="#8ff0e4"/>
  <!-- kleine Zellen -->
  <circle cx="35" cy="36" r="3.4" fill="#2f9a8f" stroke="#f6f1df" stroke-width="2"/>
  <circle cx="35.3" cy="35.8" r="1.2" fill="#8ff0e4"/>
  <circle cx="11.5" cy="36" r="2.6" fill="#2f9a8f" stroke="#f6f1df" stroke-width="1.8"/>
  <!-- Bläschen und Lebensfunke -->
  <g fill="none" stroke="#8ff0e4" stroke-width="1.2">
    <circle cx="11.5" cy="23" r="1.5"/>
    <circle cx="14" cy="19.6" r="1"/>
  </g>
  <path d="M37.5 17 Q37.5 20 40.5 20 Q37.5 20 37.5 23 Q37.5 20 34.5 20 Q37.5 20 37.5 17 Z" fill="#ffd36b"/>
  <rect x="2.6" y="2.6" width="42.8" height="42.8" rx="11.4" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
</svg>
