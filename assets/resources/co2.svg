<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Kohlendioxid</title>
  <defs>
    <g id="co2-puff">
      <circle cx="7" cy="14.8" r="4.2"/>
      <circle cx="12.2" cy="11" r="5.6"/>
      <circle cx="17.3" cy="14.6" r="4.4"/>
      <rect x="7" y="13" width="10.3" height="6"/>
    </g>
    <clipPath id="co2-clip">
      <circle cx="7" cy="14.8" r="4.2"/>
      <circle cx="12.2" cy="11" r="5.6"/>
      <circle cx="17.3" cy="14.6" r="4.4"/>
      <rect x="7" y="13" width="10.3" height="6"/>
    </clipPath>
    <linearGradient id="co2-fill" gradientUnits="userSpaceOnUse" x1="0" y1="5.4" x2="0" y2="19">
      <stop offset="0" stop-color="#d8d1c4"/>
      <stop offset="1" stop-color="#b9b0a2"/>
    </linearGradient>
  </defs>
  <!-- Kontur -->
  <use href="#co2-puff" fill="#5e5548" stroke="#5e5548" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Wolkenkörper -->
  <use href="#co2-puff" fill="url(#co2-fill)"/>
  <!-- dunklere Unterkante -->
  <rect x="2" y="16.4" width="20" height="3" fill="#857a69" clip-path="url(#co2-clip)"/>
  <path d="M8.4 9.6 A5.6 5.6 0 0 1 11 6.6" fill="none" stroke="#f4f0e8" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
